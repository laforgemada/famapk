<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apokalypsy | Tafatafa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --primary:#1E3A8A; --primary-light:#3155c7; --accent:#f59e0b;
            --bg:#eef2ff; --surface:#ffffff; --surface-glass:rgba(255,255,255,0.78);
            --text-main:#0f172a; --text-muted:#64748b; --border:#e2e8f0;
            --gradient: linear-gradient(135deg, #1E3A8A 0%, #3155c7 100%);
            --shadow: 0 15px 40px rgba(15,23,42,0.10); --shadow-soft: 0 6px 20px rgba(15,23,42,0.06);
        }

        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            margin:0; font-family:'Plus Jakarta Sans',sans-serif;
            background: radial-gradient(circle at top left, rgba(49,85,199,0.20), transparent 30%),
                        radial-gradient(circle at bottom right, rgba(245,158,11,0.12), transparent 30%), var(--bg);
            height:100vh; display:flex; flex-direction:column; overflow:hidden;
        }

        /* HEADER */
        .chat-header {
            position:relative; padding: calc(env(safe-area-inset-top) + 18px) 18px 20px 18px;
            background: linear-gradient(135deg, rgba(30,58,138,0.96), rgba(49,85,199,0.94));
            overflow:hidden; box-shadow: 0 12px 40px rgba(30,58,138,0.25); z-index:20;
        }

        .chat-header::before { content:""; position:absolute; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,0.08); top:-120px; right:-60px; }
        .chat-header::after { content:""; position:absolute; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.05); bottom:-70px; left:-30px; }

        .header-top { position:relative; z-index:2; display:flex; align-items:center; gap:14px; }
        .back-btn { min-width:46px; height:46px; border:none; border-radius:16px; background:rgba(255,255,255,0.16); backdrop-filter:blur(10px); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .chat-avatar { width:58px; height:58px; border-radius:20px; background:rgba(255,255,255,0.18); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; color:white; font-size:1.4rem; font-weight:800; border:1px solid rgba(255,255,255,0.18); box-shadow:0 10px 30px rgba(0,0,0,0.12); }
        .chat-info { flex:1; }
        .chat-title { color:white; font-size:1.05rem; font-weight:800; }
        .chat-status { margin-top:5px; display:flex; align-items:center; gap:8px; color:rgba(255,255,255,0.88); font-size:0.78rem; font-weight:700; }
        .live-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; animation:pulse 1.5s infinite; }
        .online-box { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.12); padding:10px 14px; border-radius:16px; color:white; font-size:0.78rem; font-weight:700; backdrop-filter:blur(10px); }

        @keyframes pulse { 0% { transform:scale(1); opacity:1; } 50% { transform:scale(1.4); opacity:0.5; } 100% { transform:scale(1); opacity:1; } }

        /* CHAT AREA */
        #chat-messages { flex:1; overflow-y:auto; padding:20px 16px 120px 16px; display:flex; flex-direction:column; gap:16px; scroll-behavior: smooth; }
        #chat-messages::-webkit-scrollbar { width:0; }

        .message-row { display:flex; align-items:flex-end; gap:10px; margin-bottom: 4px; }
        .message-row.sent { justify-content:flex-end; }
        .user-avatar { min-width:40px; height:40px; border-radius:12px; background:var(--gradient); display:flex; align-items:center; justify-content:center; color:white; font-size:0.8rem; box-shadow:0 4px 10px rgba(0,0,0,0.1); }

        .msg { max-width:78%; padding:12px 16px; border-radius:20px; line-height:1.5; animation:fadeIn .25s ease; word-break:break-word; box-shadow:var(--shadow-soft); position: relative; }
        .received { background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border-bottom-left-radius:4px; color:var(--text-main); border: 1px solid rgba(255,255,255,0.5); }
        .sent .msg { background:var(--gradient); color:white; border-bottom-right-radius:4px; }

        .msg-info { display:flex; align-items:center; gap:6px; margin-bottom:4px; font-size:0.7rem; font-weight:800; opacity:0.8; }
        .sent .msg-info { justify-content: flex-end; }
        .msg-time { font-size:0.6rem; opacity:0.7; }

        /* ACTIONS (MODIF / SUPPR) */
        .msg-actions { display:flex; gap:10px; margin-top:8px; border-top:1px solid rgba(255,255,255,0.2); padding-top:5px; justify-content: flex-end; }
        .action-btn { background:none; border:none; color:white; cursor:pointer; padding:2px; opacity:0.7; transition:0.2s; }
        .action-btn:hover { opacity:1; transform: scale(1.1); }
        .received .msg-actions { border-top:1px solid rgba(0,0,0,0.05); justify-content: flex-start; }
        .received .action-btn { color: var(--text-muted); }

        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        /* INPUT AREA */
        .chat-input-area { position:fixed; bottom:0; left:0; width:100%; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)) 16px; background:rgba(255,255,255,0.85); backdrop-filter:blur(20px); border-top:1px solid rgba(0,0,0,0.05); display:flex; align-items:center; gap:12px; z-index:30; }
        #chat-input { flex:1; border:none; background:white; padding:15px 18px; border-radius:20px; outline:none; font-size:0.95rem; box-shadow:var(--shadow-soft); }
        .emoji-btn, .btn-send { min-width:52px; height:52px; border:none; border-radius:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; }
        .emoji-btn { background:white; font-size:1.3rem; box-shadow:var(--shadow-soft); }
        .btn-send { background:var(--gradient); color:white; box-shadow:0 8px 20px rgba(30,58,138,0.2); }
        .emoji-btn:active, .btn-send:active { transform:scale(0.92); }

        /* EMOJI PICKER */
        .emoji-picker { position:fixed; bottom:90px; left:16px; right:16px; background:rgba(255,255,255,0.98); backdrop-filter:blur(20px); border-radius:24px; padding:15px; display:none; flex-wrap:wrap; gap:12px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); z-index:999; border: 1px solid rgba(0,0,0,0.05); }
        .show-emojis { display:flex; }
        .emoji-picker span { font-size:1.6rem; cursor:pointer; transition:.15s; }
    </style>
</head>
<body>

<div class="chat-header">
    <div class="header-top">
        <button class="back-btn" onclick="window.location.href='index.html'"><i data-feather="arrow-left"></i></button>
        <div class="chat-avatar"><i data-feather="message-circle"></i></div>
        <div class="chat-info">
            <div class="chat-title" id="chat-title">Tafatafa Public</div>
            <div class="chat-status" id="chat-status"><span class="live-dot"></span> Mivantana</div>
        </div>
        <div class="online-box"><span class="live-dot"></span> LIVE</div>
    </div>
</div>

<div id="chat-messages"></div>

<div class="emoji-picker" id="emoji-picker">
    <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span>
    <span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('🥰')">🥰</span>
    <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('❤️')">❤️</span>
    <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🙏')">🙏</span>
</div>

<div class="chat-input-area" id="chat-input-area">
    <button class="emoji-btn" onclick="openEmoji()">😊</button>
    <input type="text" id="chat-input" placeholder="..." autocomplete="off">
    <button class="btn-send" onclick="sendMessage()"><i data-feather="send"></i></button>
</div>

<script>
    const translations = {
        mg:{ title:"Tafatafa Public", status:"Mivantana", placeholder:"Hanoratra...", error:"Tsy lasa!", confirmDel: "Hafana ve ity hafatra ity?" },
        fr:{ title:"Chat Public", status:"En direct", placeholder:"Écrire...", error:"Erreur!", confirmDel: "Supprimer ce message ?" }
    };

    const currentLang = localStorage.getItem('app_lang') || 'mg';
    const t = translations[currentLang];
    const userName = localStorage.getItem('user_name');

    document.getElementById('chat-title').innerText = t.title;
    if(userName) document.getElementById('chat-input').placeholder = t.placeholder;

    function openEmoji(){ document.getElementById('emoji-picker').classList.toggle('show-emojis'); }
    function addEmoji(emoji){ document.getElementById('chat-input').value += emoji; }
    function scrollBottom() { const c = document.getElementById('chat-messages'); c.scrollTop = c.scrollHeight; }

    async function fetchMessages(){
        try {
            const r = await fetch(`https://apokalypsy.com/api/chat/messages?t=${Date.now()}`);
            const messages = await r.json();
            const container = document.getElementById('chat-messages');
            
            container.innerHTML = messages.map(m => {
                const isMe = m.author === userName;
                return `
                <div class="message-row ${isMe ? 'sent' : ''}">
                    ${!isMe ? `<div class="user-avatar"><i data-feather="user"></i></div>` : ''}
                    <div class="msg ${isMe ? 'sent' : 'received'}">
                        <div class="msg-info">${escapeHTML(m.author)} <span class="msg-time">${m.date}</span></div>
                        <div id="text-${m.id}">${escapeHTML(m.content)}</div>
                        ${isMe ? `
                            <div class="msg-actions">
                                <button class="action-btn" onclick="editMsg(${m.id})"><i data-feather="edit-2" style="width:12px"></i></button>
                                <button class="action-btn" onclick="deleteMsg(${m.id})"><i data-feather="trash-2" style="width:12px"></i></button>
                            </div>
                        ` : ''}
                    </div>
                </div>`;
            }).join('');
            feather.replace();
            scrollBottom();
        } catch(e) { console.log(e); }
    }

    async function sendMessage(){
        const input = document.getElementById('chat-input');
        const content = input.value.trim();
        if(!content || !userName) return;
        input.value = '';
        await fetch('https://apokalypsy.com/api/chat/send', {
            method: 'POST',
            body: JSON.stringify({ author: userName, content: content })
        });
        fetchMessages();
    }

    async function deleteMsg(id) {
    if(!confirm(t.confirmDel)) return;

    try {
        // On utilise POST sans en-têtes complexes si possible
        const response = await fetch(`https://apokalypsy.com/api/chat/delete/${id}`, { 
            method: 'POST' 
        });

        if (response.ok) {
            fetchMessages(); 
        } else {
            alert("Erreur lors de la suppression");
        }
    } catch(e) { 
        console.error("Erreur réseau :", e);
    }
}

    async function editMsg(id) {
        const oldText = document.getElementById(`text-${id}`).innerText;
        const newText = prompt("Modifier :", oldText);
        if(!newText || newText === oldText) return;
        await fetch(`https://apokalypsy.com/api/chat/edit/${id}`, {
            method: 'POST',
            body: JSON.stringify({ content: newText })
        });
        fetchMessages();
    }

    function escapeHTML(str){ return str.replace(/[&<>'"]/g, tag => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[tag] || tag)); }
    document.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
    
    fetchMessages();
    setInterval(fetchMessages, 10000);
</script>
</body>
</html>
