<style>

:root{

    --primary:#1E3A8A;
    --primary-light:#3155c7;

    --secondary:#7c3aed;

    --accent:#f59e0b;

    --pink:#ec4899;

    --success:#22c55e;

    --danger:#ef4444;

    --bg:#eef2ff;

    --surface:#ffffff;

    --glass:rgba(255,255,255,0.72);

    --text-main:#0f172a;

    --text-muted:#64748b;

    --border:#e2e8f0;

    --gradient:
        linear-gradient(135deg, #1E3A8A 0%, #035de3 55%, #122997 100%);

    --shadow:
        0 20px 60px rgba(15,23,42,0.12);

    --shadow-soft:
        0 10px 30px rgba(15,23,42,0.08);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    margin:0;

    font-family:'Plus Jakarta Sans',sans-serif;

    background:

        radial-gradient(
            circle at top left,
            rgba(124,58,237,0.18),
            transparent 28%

        radial-gradient(
            circle at bottom right,
            rgba(236,72,153,0.12),
            transparent 30%

    color:var(--text-main);

    padding-top:90px;

    overflow-x:hidden;
}

/* =========================
   NAVBAR
========================= */

.navbar-fixed{

    position:fixed;

    top:0;

    left:0;

    width:100%;

    z-index:9999;

    background:

    border-bottom:
        1px solid rgba(255,255,255,0.08);

    padding:14px 0;
}

.nav-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 16px;
}

.logo-area{

    display:flex;

    align-items:center;

    gap:12px;
}

.logo-icon{

    width:48px;

    height:48px;

    border-radius:18px;

    background:var(--gradient);

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    box-shadow:
        0 10px 25px rgba(124,58,237,0.35);
}

.logo-icon i{

    height:24px;
}

.logo-text{

    flex-direction:column;
}

.logo{

}

.right-zone{

.lang-select{

    border-radius:14px;

    font-size:0.74rem;

    font-weight:800;

}

.lang-select option{

}

.auth-buttons{

    display:flex;

    align-items:center;

    gap:8px;
}

.top-btn{

    border:none;

    border-radius:15px;

    padding:10px 14px;

    display:flex;

    align-items:center;

    gap:6px;

    font-size:0.72rem;

    cursor:pointer;

    transition:0.2s;

}

.top-btn:active{

    transform:scale(.95);
}

.top-btn i{

    height:15px;
}

.btn-login{

}

.btn-user{

}

.btn-dashboard{

    color:#5b21b6;
}

.btn-logout{

    color:white;
}

/* =========================
   HERO
========================= */

.hero{

    margin:0 18px 24px;

    border-radius:34px;

    position:relative;

    background:var(--gradient);

    padding:34px 26px;

}

.hero::before{

    content:"";

    width:260px;

    height:260px;

    border-radius:50%;

    top:-140px;

    right:-70px;
}

.hero::after{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    border-radius:50%;

    background:

    bottom:-80px;

    left:-40px;
}

.hero-content{

    position:relative;

    z-index:2;
}

.hero-mini{

    font-weight:800;

    margin-bottom:18px;

}

.hero-title{

    margin-bottom:14px;
}

.hero-text{

    font-size:0.95rem;
}

.hero-buttons{

}

}

.secondary-btn{

}

.hero-stats{

    gap:12px;
}

.stat-box{

}

.stat-number{

/* =========================

========================= */

/* =========================

}

.rank-badge{

.user-pts{

.feature-card{

.feature-icon.purple{

.premium-text{

.card-author{

/* =========================

========================= */

#pagination-controls{

/* =========================

========================= */

.bottom-nav{

    position:fixed;

    bottom:14px;

    left:14px;

    right:14px;

        rgba(255,255,255,0.92);

    backdrop-filter:blur(18px);

    border-radius:28px;

    padding:14px;

    display:flex;

    justify-content:space-around;

    box-shadow:
        0 18px 50px rgba(0,0,0,0.16);

}

.nav-item{

    display:flex;

    gap:6px;

.nav-item i{

}

.nav-item.active{

}

.nav-item.active i{

/* =========================

========================= */

    .features-section{

        grid-template-columns:repeat(3,1fr);
    }

    .hero-title{

        font-size:3rem;
    }
}

</style>

<script>

const translations = {

    mg:{
        connexion:"Miditra",
        logout:"Hivoaka",
        dashboard:"Dashboard",
        espace:"Espace",
        labelMavitrika:"⭐ Mpikambana mavitrika",
        labelFampianarana:"📚 Fampianarana",
        home:"Trano",
        bible:"Baiboly",
        chat:"Tafatafa",
        cats:["Rehetra","Toriteny","Faminaniana","Hira"]
    },

    fr:{
        connexion:"Connexion",
        logout:"Déconnexion",
        dashboard:"Dashboard",
        espace:"Mon espace",
        labelMavitrika:"⭐ Membres Actifs",
        labelFampianarana:"📚 Enseignements",
        home:"Accueil",
        bible:"Bible",
        chat:"Chat",
        cats:["Tous","Sermons","Prophéties","Chants"]
    },

    en:{
        connexion:"Login",
        logout:"Logout",
        dashboard:"Dashboard",
        espace:"My Space",
        labelMavitrika:"⭐ Active Members",
        labelFampianarana:"📚 Teachings",
        home:"Home",
        bible:"Bible",
        chat:"Chat",
        cats:["All","Sermons","Prophecies","Songs"]
    }
};

const API_URL =
    'https://apokalypsy.com/api/articles/list';

let allArticles = [];

let currentPage = 1;

const itemsPerPage = 5;

/* =========================
   LANG
========================= */

function changeLanguage(){

    const lang =
        document.getElementById('langSwitcher').value;

    localStorage.setItem('app_lang', lang);

    const t =
        translations[lang];

    document.getElementById('label-mavitrika')
        .innerText = t.labelMavitrika;

    document.getElementById('label-fampianarana')
        .innerText = t.labelFampianarana;

    document.getElementById('menu-home')
        .innerText = t.home;

    document.getElementById('menu-bible')
        .innerText = t.bible;

    document.getElementById('menu-chat')
        .innerText = t.chat;

    const catList =
        document.getElementById('cat-list');

    const icons =
        ['grid','book-open','zap','music'];

    catList.innerHTML = t.cats.map((name,i)=>`

        <div class="cat-badge ${i===0?'active':''}">

            <i data-feather="${icons[i]}"></i>

            ${name}

        </div>

    `).join('');

    updateAuthDisplay();

    feather.replace();
}

/* =========================
   ARTICLES
========================= */

async function fetchArticles(){

    try{

        const response =
            await fetch(`${API_URL}?t=${Date.now()}`);

        allArticles =
            await response.json();

        renderArticles();

    }catch(e){

        console.log("Erreur API");
    }
}

function renderArticles(){

    const container =
        document.getElementById('articles-container');

    container.innerHTML = '';

    const startIndex =
        (currentPage - 1) * itemsPerPage;

    const pageItems =
        allArticles.slice(
            startIndex,
            startIndex + itemsPerPage
        );

    pageItems.forEach(article => {

        const img =
            article.image_url ||
            'https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=800';

        const dateObj =
            new Date(article.created_at);

        const formattedDate =
            dateObj.toLocaleDateString(
                'fr-FR',
                {
                    day:'numeric',
                    month:'long',
                    year:'numeric'
                }
            );

        container.insertAdjacentHTML('beforeend',`

            <div class="bible-card">

                <div class="card-image"
                     style="background-image:url('${img}')">

                </div>

                <div class="card-body">

                    <div class="card-meta">

                        <div class="card-author">

                            <i data-feather="user"></i>

                            <span>Admin Apokalypsy</span>

                        </div>

                        <div class="card-date">

                            ${formattedDate}

                        </div>

                    </div>

                    <div class="card-title">

                        ${escapeHTML(article.title)}

                    </div>

                    <div class="card-text">

                        ${escapeHTML(article.content).substring(0,110)}...

                    </div>

                </div>

            </div>

        `);
    });

    updatePaginationControls();

    observeElements();

    feather.replace();
}

/* =========================
   PAGINATION
========================= */

function updatePaginationControls(){

    const controls =
        document.getElementById('pagination-controls');

    const totalPages =
        Math.ceil(allArticles.length / itemsPerPage);

    if(totalPages <= 1){

        controls.innerHTML = '';

        return;
    }

    controls.innerHTML = `

        <button class="page-btn"
                onclick="changePage(${currentPage - 1})"
                ${currentPage === 1 ? 'disabled' : ''}>

            <i data-feather="chevron-left"></i>

        </button>

        <span style="font-weight:900;">

            ${currentPage}

        </span>

        <button class="page-btn"
                onclick="changePage(${currentPage + 1})"
                ${currentPage === totalPages ? 'disabled' : ''}>

            <i data-feather="chevron-right"></i>

        </button>

    `;

    feather.replace();
}

function changePage(page){

    currentPage = page;

    renderArticles();

    window.scrollTo({
        top:450,
        behavior:'smooth'
    });
}

/* =========================
   ANIMATION
========================= */

function observeElements(){

    const observer =
        new IntersectionObserver((entries)=>{

            entries.forEach(entry=>{

                if(entry.isIntersecting){

                    entry.target.classList.add('animate');
                }
            });

        },{ threshold:0.1 });

    document.querySelectorAll('.rank-card, .bible-card')
        .forEach(el=>observer.observe(el));
}

/* =========================
   SECURITY
========================= */

function escapeHTML(str){

    return str
        ? str.replace(/[&<>'"]/g, tag => ({

            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            "'":'&#39;',
            '"':'&quot;'

        }[tag] || tag))
        : '';
}

/* =========================
   AUTH
========================= */

function updateAuthDisplay(){

    const authZone =
        document.getElementById('auth-zone');

    const lang =
        document.getElementById('langSwitcher').value;

    const t =
        translations[lang];

    const userName =
        localStorage.getItem('user_name');

    const userRole =
        localStorage.getItem('user_role');

    if(userName){

        let menuButton = '';

        if(userRole === 'ROLE_ADMIN'){

            menuButton = `

                <button class="top-btn btn-dashboard"
                        onclick="window.location.href='admin/dashboard_admin.html'">

                    <i data-feather="layout"></i>

                    ${t.dashboard}

                </button>

            `;

        }else{

            menuButton = `

                <button class="top-btn btn-user"
                        onclick="window.location.href='utilisateur/espace_personnel.html'">

                    <i data-feather="user"></i>

                    ${t.espace}

                </button>

            `;
        }

        authZone.innerHTML = `

            ${menuButton}

            <button class="top-btn btn-logout"
                    onclick="logout()">

                <i data-feather="log-out"></i>

                OUT

            </button>

        `;

    }else{

        authZone.innerHTML = `

            <a href="login/connexion.html"
               style="text-decoration:none;">

                <button class="top-btn btn-login">

                    <i data-feather="log-in"></i>

                    ${t.connexion}

                </button>

            </a>

        `;
    }

    feather.replace();
}

/* =========================
   LOGOUT
========================= */

function logout(){

    if(confirm("Hivoaka ?")){

        localStorage.removeItem('user_name');

        localStorage.removeItem('user_role');

        window.location.reload();
    }
}

/* =========================
   INIT
========================= */

window.onload = () => {

    const savedLang =
        localStorage.getItem('app_lang');

    if(savedLang){

        document.getElementById('langSwitcher').value =
            savedLang;
    }

    changeLanguage();

    fetchArticles();

    feather.replace();
};

</script>
