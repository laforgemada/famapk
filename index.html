<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apokalypsy | Pro Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
	<link rel="manifest" href="{{ asset('manifest.json') }}">
    <style>
        :root {
            --primary: #1E3A8A; 
            --accent: #f59e0b;  
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --navbar-bg: rgba(30, 58, 138, 0.98);
            --gradient: linear-gradient(135deg, #1E3A8A 0%, #1e40af 100%);
            --gold: #fbbf24;
            --shadow-card: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; background: var(--bg); padding-top: 70px; 
            color: var(--text-main);
        }

        .navbar-fixed {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: var(--navbar-bg); backdrop-filter: blur(15px);
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-top { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; color: white; }
        .logo { font-size: 0.9rem; font-weight: 900; letter-spacing: 2px; }

        .lang-select {
            background: rgba(255, 255, 255, 0.15); color: white;
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px;
            padding: 6px 10px; font-size: 0.75rem; font-weight: 700; outline: none;
        }

        .lang-select option {
            background-color: white; 
            color: #1E3A8A; 
        }

        .section-label { padding: 30px 20px 10px 20px; font-weight: 800; color: var(--primary); font-size: 1rem; }

        .podium-box { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 10px; margin-top: -30px; }
        .rank-card {
            background: var(--surface); border-radius: 24px; padding: 20px 5px;
            display: flex; flex-direction: column; align-items: center; width: 32%;
            box-shadow: var(--shadow-card); opacity: 0; transform: translateY(20px); transition: 0.5s;
        }
        .rank-card.animate { opacity: 1; transform: translateY(0); }
        .rank-1 { transform: translateY(-10px); z-index: 2; border: 2px solid var(--gold); }
        .rank-1.animate { transform: translateY(-10px); }

        .avatar {
            width: 50px; height: 50px; border-radius: 18px; background: #f1f5f9;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
            position: relative; border: 2px solid #e2e8f0; margin-bottom: 8px; color: var(--primary);
        }
        .rank-1 .avatar { width: 70px; height: 70px; border-color: var(--gold); }
        .rank-badge {
            position: absolute; bottom: -5px; right: -5px; width: 22px; height: 22px;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 800; color: white;
        }
        .rank-1 .rank-badge { background: var(--gold); }
        .rank-2 .rank-badge { background: #94a3b8; }
        .rank-3 .rank-badge { background: #b45309; }

        .name { font-size: 0.7rem; font-weight: 800; text-align: center; }
        .user-pts { color: var(--accent); font-size: 0.6rem; font-weight: 800; margin-top: 4px; }

        .category-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 20px; scrollbar-width: none; }
        .cat-badge {
            background: white; padding: 10px 16px; border-radius: 15px;
            white-space: nowrap; font-size: 0.8rem; font-weight: 700; color: var(--text-muted);
            border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 6px;
        }
        .cat-badge i { width: 14px; }
        .cat-badge.active { background: var(--primary); color: white; border-color: var(--primary); }

        .container { padding: 0 20px; }
        .bible-card {
            background: var(--surface); border-radius: 25px; margin-bottom: 20px;
            overflow: hidden; box-shadow: var(--shadow-card); opacity: 0; transform: translateY(20px); transition: 0.5s;
        }
        .bible-card.animate { opacity: 1; transform: translateY(0); }
        .card-image { height: 180px; background-size: cover; background-position: center; }
        .card-body { padding: 20px; }
        .card-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 8px; }
        .card-text { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }

        #pagination-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 120px; }
        .page-btn { width: 45px; height: 45px; border-radius: 14px; border: none; background: white; box-shadow: var(--shadow-card); color: var(--primary); }

        .bottom-nav {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            border-radius: 25px; display: flex; justify-content: space-around;
            padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 0.65rem; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { width: 20px; height: 20px; }
        .nav-item.active i { background: var(--primary); color: white; border-radius: 10px; padding: 8px; width: 38px; height: 38px; margin-top: -15px; }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent);
        }
        .card-author { display: flex; align-items: center; gap: 5px; color: var(--primary); }
        .card-author i { width: 12px; height: 12px; }
    </style>
</head>
<body>

    <header class="navbar-fixed">
        <div class="nav-top">
            <div class="logo">APOKALYPSY</div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <select class="lang-select" id="langSwitcher" onchange="changeLanguage()">
                    <option value="mg">MG</option>
                    <option value="fr">FR</option>
                    <option value="en">EN</option>
                </select>
                <div id="auth-zone"></div>
            </div>
        </div>
    </header>

    <div class="section-label" id="label-mavitrika">⭐ Mpikambana mavitrika</div>
	<br/><br/>
    <div class="podium-box">
        <div class="rank-card rank-2">
            <div class="avatar">DA<div class="rank-badge">2</div></div>
            <div class="name">Daniel A.</div>
            <div class="user-pts">950 PTS</div>
        </div>
        <div class="rank-card rank-1">
            <div class="avatar">PM<div class="rank-badge">1</div></div>
            <div class="name">Pastor Mailhol</div>
            <div class="user-pts">1520 PTS</div>
        </div>
        <div class="rank-card rank-3">
            <div class="avatar">SM<div class="rank-badge">3</div></div>
            <div class="name">Sarah M.</div>
            <div class="user-pts">780 PTS</div>
        </div>
    </div>

    <div class="section-label" id="label-fampianarana">📚 Fampianarana</div>
    <div class="category-scroll" id="cat-list"></div>

    <div class="container" id="articles-container"></div>
    <div id="pagination-controls"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i data-feather="home"></i><span id="menu-home">Accueil</span></a>
        <a href="bible.html" class="nav-item"><i data-feather="book"></i><span id="menu-bible">Bible</span></a>
        <a href="chat.html" class="nav-item"><i data-feather="message-circle"></i><span id="menu-chat">Chat</span></a>
    </nav>

<script>
    const translations = {
        mg: { connexion: "Miditra", logout: "Hivoaka", labelMavitrika: "⭐ Mpikambana mavitrika", labelFampianarana: "📚 Fampianarana", home: "Trano", bible: "Baiboly", chat: "Tafatafa", cats: ["Rehetra", "Toriteny", "Faminaniana", "Hira"]},
        fr: { connexion: "Connexion", logout: "Déconnexion", labelMavitrika: "⭐ Membres Actifs", labelFampianarana: "📚 Enseignements", home: "Accueil", bible: "Bible", chat: "Chat", cats: ["Tous", "Sermons", "Prophéties", "Chants"]},
        en: { connexion: "Login", logout: "Logout", labelMavitrika: "⭐ Active Members", labelFampianarana: "📚 Teachings", home: "Home", bible: "Bible", chat: "Chat", cats: ["All", "Sermons", "Prophecies", "Songs"]}
    };

    const API_URL = 'https://apokalypsy.com/api/articles/list';
    let allArticles = [];
    let currentPage = 1;
    const itemsPerPage = 5;

    // --- MISE À JOUR UNIQUE DE LA LANGUE ET DE L'AUTH ---
    function changeLanguage() {
        const lang = document.getElementById('langSwitcher').value;
        localStorage.setItem('app_lang', lang); 
        const t = translations[lang];
        
        document.getElementById('label-mavitrika').innerText = t.labelMavitrika;
        document.getElementById('label-fampianarana').innerText = t.labelFampianarana;
        document.getElementById('menu-home').innerText = t.home;
        document.getElementById('menu-bible').innerText = t.bible;
        document.getElementById('menu-chat').innerText = t.chat;

        const catList = document.getElementById('cat-list');
        const icons = ['grid', 'book-open', 'zap', 'music'];
        catList.innerHTML = t.cats.map((name, i) => `
            <div class="cat-badge ${i===0?'active':''}">
                <i data-feather="${icons[i]}"></i>${name}
            </div>
        `).join('');
        
        updateAuthDisplay();
        feather.replace();
    }

    async function fetchArticles() {
        try {
            const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
            allArticles = await response.json();
            renderArticles();
        } catch (e) { console.log("Erreur API"); }
    }

    function renderArticles() {
        const container = document.getElementById('articles-container');
        container.innerHTML = '';
        const startIndex = (currentPage - 1) * itemsPerPage;
        const pageItems = allArticles.slice(startIndex, startIndex + itemsPerPage);

        pageItems.forEach(article => {
            const img = article.image_url || 'https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=500';
            const dateObj = new Date(article.created_at);
            const formattedDate = dateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

            container.insertAdjacentHTML('beforeend', `
                <div class="bible-card">
                    <div class="card-image" style="background-image: url('${img}');"></div>
                    <div class="card-body">
                        <div class="card-meta">
                            <div class="card-author"><i data-feather="user"></i><span>Admin Apokalypsy</span></div>
                            <div class="card-date">${formattedDate}</div>
                        </div>
                        <div class="card-title">${escapeHTML(article.title)}</div>
                        <div class="card-text">${escapeHTML(article.content).substring(0, 100)}...</div>
                    </div>
                </div>
            `);
        });
        updatePaginationControls();
        observeElements();
        feather.replace();
    }

    function updatePaginationControls() {
        const controls = document.getElementById('pagination-controls');
        const totalPages = Math.ceil(allArticles.length / itemsPerPage);
        if (totalPages <= 1) return;
        controls.innerHTML = `
            <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i data-feather="chevron-left"></i></button>
            <span style="font-weight: 800;">${currentPage}</span>
            <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><i data-feather="chevron-right"></i></button>
        `;
        feather.replace();
    }

    function changePage(page) {
        currentPage = page;
        renderArticles();
        window.scrollTo({ top: 400, behavior: 'smooth' });
    }

    function observeElements() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('animate');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.rank-card, .bible-card').forEach(el => observer.observe(el));
    }

    function escapeHTML(str) {
        return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';
    }

    function updateAuthDisplay() {
        const authZone = document.getElementById('auth-zone');
        const lang = document.getElementById('langSwitcher').value;
        const userName = localStorage.getItem('user_name'); 
        if (userName) {
            authZone.innerHTML = `<button onclick="logout()" style="background:#ef4444; color:white; border:none; padding:8px 12px; border-radius:10px; font-weight:800; font-size:0.7rem; cursor:pointer;">OUT</button>`;
        } else {
            authZone.innerHTML = `<a href="login/connexion.html" style="text-decoration:none; background:var(--accent); color:var(--primary); padding:8px 12px; border-radius:10px; font-weight:800; font-size:0.7rem;">${translations[lang].connexion}</a>`;
        }
    }

    function logout() {
        if(confirm("Hivoaka?")) { localStorage.removeItem('user_name'); window.location.reload(); }
    }

    window.onload = () => {
        // Restaurer la langue si déjà choisie
        const savedLang = localStorage.getItem('app_lang');
        if(savedLang) document.getElementById('langSwitcher').value = savedLang;
        changeLanguage(); 
        fetchArticles();
    };
</script>
</body>
</html>
