<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apokalypsy - Publier un Article</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chemin vers ton CSS partagé -->
    <link rel="stylesheet" href="../css/admin-style.css">
</head>
<body>

    <!-- Conteneurs pour les Partials -->
    <div id="sidebar-placeholder"></div>
    <div id="header-placeholder"></div>

    <main class="main-content">
        <div style="margin-bottom: 30px;">
            <h1>Nouvel Article</h1>
            <p style="color: #64748b;">Rédigez et publiez du contenu pour apokalypsy.com.</p>
        </div>

        <form class="editor-container" id="articleForm">
            <div class="form-group">
                <label>Titre de l'article</label>
                <input type="text" id="title" placeholder="Ex: Les secrets de la tech à Madagascar..." required>
            </div>

            <div class="form-group">
                <label>Image de couverture (URL)</label>
                <input type="text" id="image_url" placeholder="https://lien-vers-image.jpg" oninput="previewImage()">
                <img id="imagePreview" alt="Aperçu" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-top: 10px; display: none;">
            </div>

            <div class="form-group">
                <label>Contenu de l'article</label>
                <textarea id="content" rows="10" placeholder="Écrivez votre article ici..." required></textarea>
            </div>

            <button type="submit" class="btn-publish" id="btnSubmit">
                <i class="fa-solid fa-paper-plane"></i> PUBLIER L'ARTICLE
            </button>
        </form>
    </main>

    <script>
        async function loadComponents() {
            // Chargement des partials depuis le dossier parent
            const menuRes = await fetch('partials/menu.html');
            document.getElementById('sidebar-placeholder').innerHTML = await menuRes.text();
            
            const headerRes = await fetch('partials/header.html');
            document.getElementById('header-placeholder').innerHTML = await headerRes.text();

            initPage();
        }

        function initPage() {
            // Mise à jour de la date dans le header
            const dateEl = document.getElementById('headerDate');
            if(dateEl) {
                dateEl.innerText = new Date().toLocaleDateString('fr-FR', { 
                    day: 'numeric', month: 'long', year: 'numeric' 
                });
            }

            // Activer le lien "Articles" dans le menu
            const link = document.getElementById('link-articles');
            if(link) link.classList.add('active');

            // Vérification de sécurité
            if (!localStorage.getItem('user_full_data')) {
                window.location.replace('../login/connexion.html');
            }
        }

        function previewImage() {
            const url = document.getElementById('image_url').value;
            const img = document.getElementById('imagePreview');
            if(url) { img.src = url; img.style.display = 'block'; }
            else { img.style.display = 'none'; }
        }

        document.getElementById('articleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const userData = JSON.parse(localStorage.getItem('user_full_data'));

            const articleData = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                image: document.getElementById('image_url').value,
                author: userData.username
            };

            btn.disabled = true;
            btn.innerText = "PUBLICATION...";

            try {
                const response = await fetch('https://apokalypsy.com/api/articles/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(articleData)
                });

                if (response.ok) {
                    alert("Article publié avec succès !");
                    window.location.reload();
                } else {
                    alert("Erreur lors de la publication.");
                    btn.disabled = false;
                    btn.innerText = "PUBLIER L'ARTICLE";
                }
            } catch (error) {
                alert("Erreur serveur.");
                btn.disabled = false;
                btn.innerText = "PUBLIER L'ARTICLE";
            }
        });

        function deconnexion() {
            if(confirm("Déconnexion ?")) { 
                localStorage.clear(); 
                window.location.replace('../login/connexion.html'); 
            }
        }

        window.onload = loadComponents;
    </script>
</body>
</html>
