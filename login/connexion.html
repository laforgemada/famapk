<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apokalypsy - Connexion</title>

    <style>
        :root {
            --primary: #1E3A8A;
            --bg: #f3f4f6;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-login {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            background: #f9f9f9;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .social-separator {
            margin: 20px 0;
            display: flex;
            align-items: center;
            color: #9ca3af;
            font-size: 0.8rem;
        }

        .social-separator::before,
        .social-separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
            margin: 0 10px;
        }

        .social-login-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #dadce0;
            font-weight: 500;
            background: white;
            color: #3c4043;
            cursor: pointer;
        }

        .btn-social img {
            width: 18px;
        }

        .btn-social.btn-facebook {
            background-color: #1877F2;
            color: white;
            border: none;
        }

        #error-msg {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo-login">APOKALYPSY</div>

    <h2>Espace Membre</h2>

    <div id="error-msg"></div>

    <!-- FORMULAIRE CLASSIQUE -->
    <form id="loginForm">

        <input
            type="text"
            id="identifier"
            placeholder="Email ou Pseudo"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            required
        >

        <button type="submit" id="btnSubmit">
            SE CONNECTER
        </button>

    </form>

    <div class="social-separator">OU</div>

    <!-- LOGIN SOCIAL -->
    <div class="social-login-container">

        <!-- GOOGLE -->
        <button
            type="button"
            class="btn-social btn-google"
            onclick="handleSocialLogin('google')"
        >
            <img
                src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg"
                alt=""
            >

            <span>Continuer avec Google</span>
        </button>

        <!-- FACEBOOK -->
        <button
            type="button"
            class="btn-social btn-facebook"
            onclick="handleSocialLogin('facebook')"
        >
            <img
                src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"
                alt=""
            >

            <span>Continuer avec Facebook</span>
        </button>

    </div>

    <div style="margin-top:20px; font-size:0.9rem;">

        Pas encore membre ?

        <a
            href="inscription.html"
            style="color:var(--primary); font-weight:bold; text-decoration:none;"
        >
            S'inscrire
        </a>

    </div>

    <a
        href="../index.html"
        style="display:block; margin-top:20px; color:#999; text-decoration:none; font-size:0.8rem;"
    >
        ← Retour
    </a>

</div>

<script>

    /**
     * LOGIN SOCIAL
     * Redirection vers Symfony EN LIGNE
     */
    function handleSocialLogin(provider) {

        window.location.href =
            `https://apokalypsy.com/connect/${provider}`;
    }


    /**
     * LOGIN CLASSIQUE API
     */
    document
        .getElementById('loginForm')
        .addEventListener('submit', async function(e) {

            e.preventDefault();

            const btn = document.getElementById('btnSubmit');

            const errorDiv =
                document.getElementById('error-msg');

            errorDiv.style.display = "none";

            btn.disabled = true;

            btn.innerText = "CONNEXION...";

            try {

                const response = await fetch(
                    'http://localhost:8080/utilisateur/espace_personnel.html',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({

                            email:
                                document.getElementById('identifier').value,

                            password:
                                document.getElementById('password').value
                        })
                    }
                );

                const data = await response.json();

                if (
                    response.ok &&
                    data.status === 'success'
                ) {

                    localStorage.setItem(
                        'user_name',
                        data.userData.username
                    );

                    localStorage.setItem(
                        'user_full_data',
                        JSON.stringify(data.userData)
                    );

                    if (
                        data.userData.roles.includes('ROLE_ADMIN')
                    ) {

                        window.location.replace(
                            '../admin/dashboard_admin.html'
                        );

                    } else {

                        window.location.replace(
                            '../utilisateur/espace_personnel.html'
                        );
                    }

                } else {

                    errorDiv.innerText =
                        data.message ||
                        data.error ||
                        "Identifiants incorrects";

                    errorDiv.style.display = "block";

                    btn.disabled = false;

                    btn.innerText = "SE CONNECTER";
                }

            } catch (err) {

                errorDiv.innerText =
                    "Serveur injoignable";

                errorDiv.style.display = "block";

                btn.disabled = false;

                btn.innerText = "SE CONNECTER";
            }
        });

</script>

</body>
</html>
